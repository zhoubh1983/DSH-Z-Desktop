# dsh-webhook-plugin 的 bundle 补丁。
# `dsh plugin add` 会把整个插件装进 profile 后自动应用本补丁（无需手动改 profile 的 cordis.patch.yml）。
# 本补丁只插入自己的插件行；具体配置（端口、路径、skills 等）可在这里直接写，
# 也可留在 profile 层 cordis.patch.yml 里按 id 覆盖。
- insert:
    - id: dsh-webhook
      name: dsh-webhook-plugin
      config:
        host: '0.0.0.0'
        port: 8787
        path: '/webhook'
        sessionId: 'webhook'
        defaultSkill: 'HandleAlert'
        autoCreate: false
        skills:
          HandleAlert:
            prompt: '收到来自系统 {system} 的告警（推送时间 {time}）。{message} 请按运维预案分析根因并给出处置建议。'
        maxBodyBytes: 1048576