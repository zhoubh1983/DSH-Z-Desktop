# dsh-skill-market 的 bundle 补丁。
# `dsh plugin add` / GUI 内置插件同步后自动应用本补丁，向 profile 组合插入本插件。
# 具体配置（enabled / marketUrl）可在这里直接写，
# 也可在 profile 层 cordis.patch.yml 里按 id 覆盖。
- insert:
    - id: dsh-skill-market
      name: dsh-skill-market
      config:
        enabled: true
        # 留空 = 使用默认市场目录 ~/.dsh/skills-market（GUI 启动时把内置技能集合同步到此处）
        marketUrl: ''
