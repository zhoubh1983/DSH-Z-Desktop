# dsh-memory-plugin 的 bundle 补丁。
# `dsh plugin add` 安装后自动应用本补丁，向 profile 组合插入本插件。
# 具体配置（provider/model、阈值、注入条数等）可在这里直接写，
# 也可在 profile 层 cordis.patch.yml 里按 id 覆盖。
- insert:
    - id: dsh-memory
      name: dsh-memory-plugin
      config:
        enabled: true
        autoExtract: true
        provider: ''
        model: ''
        minMessages: 3
        injectTopK: 8
        injectMaxChars: 1500
        decayDays: 30
        summarize: true
