<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能市场 · DSH Desktop 高保真原型</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="skill-market">
  <div class="app">

    <!-- 左侧设置导航（App Shell，模拟 DSH 设置面板） -->
    <aside class="nav">
      <div class="nav-brand">
        <span class="nav-brand-mark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        </span>
        <span class="nav-brand-text">DSH Desktop<span>设置</span></span>
      </div>
      <nav class="nav-list">
        <a class="nav-item" data-nav="general" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span>通用设置</span></a>
        <a class="nav-item" data-nav="model" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></svg></span><span>模型</span></a>
        <a class="nav-item" data-nav="plugin" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v4M14 3v4M8 7h8l1 5-5 4-5-4 1-5Z"/></svg></span><span>插件</span></a>
        <a class="nav-item" data-nav="companion" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12c.9-3.5 4.9-6 8.5-6 3.6 0 6.1 2.5 7 6-.9 3.5-3.4 6-7 6s-7.6-2.5-8.5-6Z"/><path d="M18 12v.5"/><path d="M7 10.7C7 8 5.6 6 2.7 5.5c-1 1.5-1 5 .2 6.5-1.2 1.5-1.2 5-.2 6.5C5.6 18 7 16 7 13.3"/></svg></span><span>桌面伴侣</span></a>
        <a class="nav-item" data-nav="webhook" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span><span>Webhook 告警</span></a>
        <a class="nav-item" data-nav="memory" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg></span><span>记忆与知识库</span></a>
        <a class="nav-item" data-nav="agent" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg></span><span>Agent 预设</span></a>
        <a class="nav-item" data-nav="skills" aria-disabled="true"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/></svg></span><span>技能与 MCP</span></a>
        <a class="nav-item active" data-nav="skill-market"><span class="nav-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span><span>技能市场</span></a>
      </nav>
      <div class="nav-foot">v0.1.0 · 本地离线</div>
    </aside>

    <!-- 右侧内容区 -->
    <main class="main">
      <div class="main-inner" id="app-root">
        <!-- 由 state.js 渲染 -->
      </div>
    </main>
  </div>

  <!-- 市场设置弹窗 -->
  <div class="mask" id="modal-mask" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-head">
      <h3 class="modal-title" id="modal-title">市场设置</h3>
      <button class="modal-x" id="btn-close-modal" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <p class="modal-sub">配置技能市场来源。留空使用内置市场；可指向任意本地目录（含 manifest.json 与 skills/ 子目录）。</p>
    <div class="modal-current">当前：<code id="current-dir">默认 ~/.dsh/skills-market</code></div>
    <div class="modal-field">
      <label for="market-url">市场地址</label>
      <input class="input" id="market-url" placeholder="默认 ~/.dsh/skills-market" />
    </div>
    <div class="modal-actions">
      <button class="btn" id="btn-cancel-modal" type="button">取消</button>
      <button class="btn primary" id="btn-save-modal" type="button">保存</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="./mock.js"></script>
  <script src="./api.js"></script>
  <script src="./state.js"></script>
</body>
</html>
